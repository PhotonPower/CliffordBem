# Python-Paket cliffordbem (v0.42): pip install .   (baut den C++-Kern und das pybind11-Modul mit CMake)
# Entwicklung ohne Installation: cmake -S . -B build -DCBEM_BUILD_PYTHON=ON && cmake --build build -j && PYTHONPATH=build/python ...
[build-system]
requires = ["scikit-build-core>=0.8", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "cliffordbem"
dynamic = ["version"]
description = "Koordinatenfreie Randelementmethode der Nano-Optik in der Clifford-Algebra Cl3(C) (Python-Anbindung)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
test = ["scipy"]           # Mie-Referenzen aus tools/ fuer bindings/python/tests
plot = ["matplotlib"]      # examples/python

[project.urls]
Repository = "https://github.com/PhotonPower/CliffordBem"

[tool.scikit-build]
minimum-version = "0.8"
build-dir = "build/{wheel_tag}"
wheel.packages = ["bindings/python/cliffordbem"]
sdist.exclude = ["results", "docs/papers", "prototype", "build"]

[tool.scikit-build.cmake.define]
CBEM_BUILD_PYTHON = "ON"
CBEM_BUILD_TESTS = "OFF"
CBEM_BUILD_APPS = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(CliffordBem VERSION (?P<value>[0-9.]+)'
